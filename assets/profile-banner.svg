<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">56wj — AI Engineering and Agent Systems</title>
  <desc id="desc">Dark blue developer profile banner with a geometric grid and cyan accent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1d32"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7dd3fc" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="1090" cy="78" r="128" fill="#0ea5e9" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1180" cy="280" r="150" fill="#14b8a6" opacity="0.09" filter="url(#glow)"/>

  <g transform="translate(90 76)">
    <rect x="0" y="0" width="10" height="208" rx="5" fill="url(#accent)"/>
    <text x="48" y="82" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="76" font-weight="750" letter-spacing="-2">56wj</text>
    <text x="50" y="132" fill="#7dd3fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" letter-spacing="2.4">SOFTWARE ENGINEER</text>
    <text x="50" y="183" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25">AI Engineering · Java / Spring · Agent Systems</text>
  </g>

  <g transform="translate(958 134)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 46 L54 0 L108 46 L162 0 L216 46" stroke="#38bdf8" stroke-width="4" opacity="0.9"/>
    <path d="M0 90 L54 44 L108 90 L162 44 L216 90" stroke="#2dd4bf" stroke-width="4" opacity="0.55"/>
    <circle cx="54" cy="0" r="7" fill="#38bdf8" stroke="none"/>
    <circle cx="108" cy="90" r="7" fill="#2dd4bf" stroke="none"/>
    <circle cx="216" cy="46" r="7" fill="#7dd3fc" stroke="none"/>
  </g>
</svg>

